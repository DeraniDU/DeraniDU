<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="Animated system architecture diagram" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
    .t{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
    .s{fill:#9ca3af;font-size:10px;text-anchor:middle}
    .lbl{fill:#34D399;font-size:11px;letter-spacing:2px}
    .node{fill:#0a0a0a;stroke:#34D399;stroke-width:1.5;animation:pulse 3s ease-in-out infinite}
    .flow{fill:none;stroke:#34D399;stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:5 6;animation:dash 1s linear infinite}
    .alert{fill:none;stroke:#34D399;stroke-opacity:.25;stroke-width:1.2;stroke-dasharray:3 5;animation:dash 1.4s linear infinite}
    .led{fill:#34D399;animation:blink 1.6s ease-in-out infinite}
    .ecg{fill:none;stroke:#34D399;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:240;animation:ecg 3s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-22}}
    @keyframes pulse{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
    @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes ecg{from{stroke-dashoffset:240}to{stroke-dashoffset:-240}}
  </style>

  <rect width="900" height="450" rx="16" fill="#000"/>
  <rect x="1" y="1" width="898" height="448" rx="15" fill="none" stroke="#34D399" stroke-opacity=".25"/>
  <text class="lbl" x="30" y="32">// SYSTEM ARCHITECTURE . REQUEST FLOW</text>

  <!-- connection lines -->
  <path class="flow" d="M150 210 L210 210"/>
  <path class="flow" d="M330 210 C365 210 365 90 400 90"/>
  <path class="flow" d="M330 210 L400 205"/>
  <path class="flow" d="M330 210 C365 210 365 320 400 320"/>
  <path class="flow" d="M540 90 C575 90 575 210 610 210"/>
  <path class="flow" d="M540 205 L610 210"/>
  <path class="flow" d="M540 320 C575 320 575 210 610 210"/>
  <path class="flow" d="M700 210 C735 210 735 130 770 130"/>
  <path class="flow" d="M700 210 C735 210 735 290 770 290"/>
  <path class="alert" d="M470 350 L470 385"/>
  <path class="alert" d="M655 250 L655 385"/>

  <!-- nodes -->
  <g>
    <rect class="node" x="30" y="170" width="120" height="80" rx="12"/>
    <text class="t" x="90" y="205">CLIENTS</text><text class="s" x="90" y="224">Web . Mobile</text>
    <circle class="led" cx="140" cy="180" r="3"/>
  </g>
  <g>
    <rect class="node" x="210" y="170" width="120" height="80" rx="12" style="animation-delay:.4s"/>
    <text class="t" x="270" y="205">API GATEWAY</text><text class="s" x="270" y="224">Auth . Limits</text>
    <circle class="led" cx="320" cy="180" r="3" style="animation-delay:.3s"/>
  </g>
  <g>
    <rect class="node" x="400" y="60" width="140" height="60" rx="12" style="animation-delay:.8s"/>
    <text class="t" x="470" y="86">PAYMENTS</text><text class="s" x="470" y="104">Microservice</text>
    <circle class="led" cx="530" cy="70" r="3" style="animation-delay:.6s"/>
  </g>
  <g>
    <rect class="node" x="400" y="175" width="140" height="60" rx="12" style="animation-delay:1.1s"/>
    <text class="t" x="470" y="201">ACCOUNTS</text><text class="s" x="470" y="219">Microservice</text>
    <circle class="led" cx="530" cy="185" r="3" style="animation-delay:.9s"/>
  </g>
  <g>
    <rect class="node" x="400" y="290" width="140" height="60" rx="12" style="animation-delay:1.4s"/>
    <text class="t" x="470" y="316">NOTIFICATIONS</text><text class="s" x="470" y="334">Microservice</text>
    <circle class="led" cx="530" cy="300" r="3" style="animation-delay:1.2s"/>
  </g>
  <g>
    <rect class="node" x="610" y="170" width="90" height="80" rx="12" style="animation-delay:1.7s"/>
    <text class="t" x="655" y="205">QUEUE</text><text class="s" x="655" y="224">Events</text>
    <circle class="led" cx="690" cy="180" r="3" style="animation-delay:1.5s"/>
  </g>
  <g>
    <rect class="node" x="770" y="100" width="100" height="60" rx="12" style="animation-delay:2s"/>
    <text class="t" x="820" y="126">DATABASE</text><text class="s" x="820" y="144">Persistent</text>
    <circle class="led" cx="860" cy="110" r="3" style="animation-delay:1.8s"/>
  </g>
  <g>
    <rect class="node" x="770" y="260" width="100" height="60" rx="12" style="animation-delay:2.3s"/>
    <text class="t" x="820" y="286">CACHE</text><text class="s" x="820" y="304">In-memory</text>
    <circle class="led" cx="860" cy="270" r="3" style="animation-delay:2.1s"/>
  </g>

  <!-- support & monitoring -->
  <rect class="node" x="210" y="385" width="480" height="42" rx="12" style="animation-delay:.2s"/>
  <text x="232" y="411" fill="#fff" font-size="12" font-weight="700">SUPPORT &amp; MONITORING</text>
  <text x="408" y="411" fill="#9ca3af" font-size="11">24/7 . incidents . RCA</text>
  <polyline class="ecg" points="560,406 580,406 588,406 594,391 602,420 610,400 617,406 640,406 650,406 656,391 664,420 672,400 679,406"/>

  <!-- moving packets -->
  <circle r="4.5" fill="#34D399"><animateMotion dur="1.2s" repeatCount="indefinite" path="M150 210 L210 210"/></circle>
  <circle r="4.5" fill="#fff"><animateMotion dur="1.2s" begin=".6s" repeatCount="indefinite" path="M150 210 L210 210"/></circle>

  <circle r="4" fill="#34D399"><animateMotion dur="1.4s" begin=".3s" repeatCount="indefinite" path="M330 210 C365 210 365 90 400 90"/></circle>
  <circle r="4" fill="#34D399"><animateMotion dur="1.2s" begin=".5s" repeatCount="indefinite" path="M330 210 L400 205"/></circle>
  <circle r="4" fill="#34D399"><animateMotion dur="1.4s" begin=".9s" repeatCount="indefinite" path="M330 210 C365 210 365 320 400 320"/></circle>

  <circle r="4" fill="#fff"><animateMotion dur="1.4s" begin=".2s" repeatCount="indefinite" path="M540 90 C575 90 575 210 610 210"/></circle>
  <circle r="4" fill="#fff"><animateMotion dur="1.2s" begin=".7s" repeatCount="indefinite" path="M540 205 L610 210"/></circle>
  <circle r="4" fill="#fff"><animateMotion dur="1.4s" begin="1s" repeatCount="indefinite" path="M540 320 C575 320 575 210 610 210"/></circle>

  <circle r="4" fill="#34D399"><animateMotion dur="1.3s" begin=".1s" repeatCount="indefinite" path="M700 210 C735 210 735 130 770 130"/></circle>
  <circle r="4" fill="#34D399"><animateMotion dur="1.3s" begin=".8s" repeatCount="indefinite" path="M700 210 C735 210 735 290 770 290"/></circle>

  <circle r="3.5" fill="#fff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M655 250 L655 385"/></circle>
  <circle r="3.5" fill="#fff"><animateMotion dur="1.6s" begin=".5s" repeatCount="indefinite" path="M470 350 L470 385"/></circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
