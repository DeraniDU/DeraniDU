<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Animated cartoon of a support engineer monitoring systems" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
    .led{animation:blink2 1.4s ease-in-out infinite}
    .ecg{fill:none;stroke:#34D399;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;animation:ecg 3s linear infinite}
    .steam{fill:none;stroke:#fff;stroke-opacity:.5;stroke-width:2;stroke-linecap:round;animation:steam 2.4s ease-in-out infinite}
    .typing{animation:type .5s ease-in-out infinite alternate}
    .msg1{animation:m1 8s infinite}
    .msg2{animation:m2 8s infinite}
    .cloud{animation:drift 14s linear infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes blink2{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes ecg{from{stroke-dashoffset:200}to{stroke-dashoffset:-200}}
    @keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
    @keyframes type{from{transform:translateY(0)}to{transform:translateY(-3px)}}
    @keyframes m1{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
    @keyframes m2{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
    @keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(980px)}}
  </style>

  <rect width="900" height="300" rx="16" fill="#000"/>
  <rect x="1" y="1" width="898" height="298" rx="15" fill="none" stroke="#34D399" stroke-opacity=".25"/>

  <!-- speech bubble -->
  <g>
    <g class="msg1">
      <rect x="170" y="22" width="230" height="38" rx="12" fill="#0a0a0a" stroke="#34D399"/>
      <path d="M268 60 L278 74 L290 60" fill="#0a0a0a" stroke="#34D399"/>
      <rect x="262" y="58" width="34" height="3" fill="#0a0a0a"/>
      <text x="285" y="46" fill="#fff" font-size="12" text-anchor="middle">All systems operational</text>
    </g>
    <g class="msg2">
      <rect x="170" y="22" width="230" height="38" rx="12" fill="#0a0a0a" stroke="#34D399"/>
      <path d="M268 60 L278 74 L290 60" fill="#0a0a0a" stroke="#34D399"/>
      <rect x="262" y="58" width="34" height="3" fill="#0a0a0a"/>
      <text x="285" y="46" fill="#34D399" font-size="12" text-anchor="middle">Incident resolved. Next!</text>
    </g>
  </g>

  <!-- engineer -->
  <rect x="268" y="150" width="64" height="90" rx="22" fill="#34D399"/>
  <circle cx="300" cy="170" r="0" fill="#000"/>
  <path d="M300 152 L300 176" stroke="#000" stroke-opacity=".25" stroke-width="2"/>
  <rect x="290" y="148" width="20" height="12" rx="5" fill="#f2c9a0"/>
  <circle cx="300" cy="126" r="26" fill="#ffd7b5"/>
  <path d="M274 124 A26 26 0 0 1 326 124 Q314 108 298 110 Q282 112 274 124 Z" fill="#2a2a2a" stroke="#444"/>
  <path d="M272 126 A28 28 0 0 1 328 126" fill="none" stroke="#34D399" stroke-width="4"/>
  <rect x="266" y="122" width="9" height="18" rx="4" fill="#34D399"/>
  <path d="M270 138 Q268 154 290 150" fill="none" stroke="#34D399" stroke-width="3"/>
  <circle cx="291" cy="150" r="3.5" fill="#34D399"/>
  <ellipse class="eye" cx="311" cy="126" rx="3" ry="4" fill="#111"/>
  <ellipse class="eye" cx="323" cy="126" rx="3" ry="4" fill="#111"/>
  <path d="M310 138 Q318 145 326 138" fill="none" stroke="#7a4a2a" stroke-width="2" stroke-linecap="round"/>
  <g class="typing"><path d="M322 182 L372 196" stroke="#34D399" stroke-width="13" stroke-linecap="round"/><circle cx="374" cy="197" r="6" fill="#ffd7b5"/></g>

  <!-- desk -->
  <rect x="230" y="204" width="440" height="12" rx="4" fill="#1c1c1c" stroke="#34D399" stroke-opacity=".5"/>
  <rect x="240" y="216" width="420" height="70" fill="#0b0b0b"/>

  <!-- monitor -->
  <rect x="360" y="86" width="190" height="104" rx="8" fill="#0a0a0a" stroke="#34D399" stroke-width="2"/>
  <rect x="448" y="190" width="14" height="14" fill="#1c1c1c"/>
  <rect x="425" y="200" width="60" height="5" rx="2" fill="#1c1c1c"/>
  <text x="372" y="108" fill="#34D399" font-size="10">uptime 99.9%</text>
  <circle class="led" cx="535" cy="104" r="3" fill="#34D399"/>
  <polyline class="ecg" points="372,150 400,150 410,150 417,126 425,172 433,140 441,150 470,150 480,150 487,126 495,172 503,140 511,150 540,150"/>
  <rect x="372" y="168" width="40" height="5" rx="2" fill="#34D399" fill-opacity=".6"/>
  <rect x="418" y="168" width="60" height="5" rx="2" fill="#fff" fill-opacity=".25"/>

  <!-- keyboard -->
  <rect x="372" y="199" width="84" height="6" rx="2" fill="#2a2a2a" stroke="#34D399" stroke-opacity=".4"/>

  <!-- coffee -->
  <rect x="580" y="182" width="24" height="22" rx="4" fill="#fff"/>
  <path d="M604 188 Q614 190 604 198" fill="none" stroke="#fff" stroke-width="3"/>
  <path class="steam" d="M588 176 Q584 168 588 160"/>
  <path class="steam" d="M596 176 Q600 168 596 160" style="animation-delay:.8s"/>

  <!-- server rack -->
  <rect x="720" y="50" width="130" height="200" rx="10" fill="#0a0a0a" stroke="#34D399" stroke-width="2"/>
  <g stroke="#34D399" stroke-opacity=".35">
    <rect x="732" y="64" width="106" height="36" rx="5" fill="#111"/>
    <rect x="732" y="108" width="106" height="36" rx="5" fill="#111"/>
    <rect x="732" y="152" width="106" height="36" rx="5" fill="#111"/>
    <rect x="732" y="196" width="106" height="36" rx="5" fill="#111"/>
  </g>
  <g fill="#34D399">
    <circle class="led" cx="746" cy="82" r="3"/><circle class="led" cx="758" cy="82" r="3" style="animation-delay:.3s"/>
    <circle class="led" cx="746" cy="126" r="3" style="animation-delay:.6s"/><circle class="led" cx="758" cy="126" r="3" style="animation-delay:.9s"/>
    <circle class="led" cx="746" cy="170" r="3" style="animation-delay:.2s"/><circle class="led" cx="758" cy="170" r="3" style="animation-delay:.5s"/>
    <circle class="led" cx="746" cy="214" r="3" style="animation-delay:.8s"/><circle class="led" cx="758" cy="214" r="3" style="animation-delay:.1s"/>
  </g>
  <g stroke="#fff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round">
    <path d="M778 82 H826"/><path d="M778 126 H826"/><path d="M778 170 H826"/><path d="M778 214 H826"/>
  </g>
  <text x="785" y="268" fill="#9ca3af" font-size="10" text-anchor="middle">PROD CLUSTER</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
